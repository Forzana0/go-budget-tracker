services:
  db:
    image: postgres:16-alpine
    container_name: budget_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: budget_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d budget_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: budget_app
    restart: always
    ports:
      - "9091:9091"
    environment:
      SERVER_PORT: ":9091"
      DATABASE_URL: "postgres://postgres:mysecretpassword@db:5432/budget_db?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
